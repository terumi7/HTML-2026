    <p>
        夕方まだ明るいうちに眠たくなったので流れのままに寝て、目が覚めたら外は暗くなっていて、窓から見える空にぼーんと満月が浮かんでいた。
        静かで、窓から見えるのは月だけで、あかあかと光っているのに少し霞んでいて、月が生きているみたいだった。
        そのままベッドから月を眺めて、ぼーっとしていた。何分ぐらいそうしただろうか。
