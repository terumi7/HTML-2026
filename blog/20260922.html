    <p>細野晴臣の新譜が最高だった。年を重ねて晩年も晩年だけどもまだ進んでる。日本が休みなので仕事はゆっくり。オフィスには行った。
        李白の月下獨酌、久々に読み返したけどやっぱりいい。ていうか、この人酒ばっかり飲んでるしいつも寂しそうにしてるし、そのわりに人気者で、豪傑っぽいのにすごく細かくて、自分を客観視してしまう人だったんだろうな。
        一茶とも少し似ている。前述の詩は、李白が月と、自分の影を相手にして酒を飲むという詩。宇宙と自然のスケール感を持ちながら自分の孤独を詠む、天空から世界を眺めているかのような視点。
    </p>
