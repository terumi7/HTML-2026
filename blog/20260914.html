        朝は少しだらけて、昼はオフィスのランチが美味しいと聞いたのでオフィスに行った。チリコンカン、美味しかった。
        それから焙煎所の人が来ていたのでコーヒーを飲んだ。カメルーンのコーヒー。初めて飲んだ。すっきりしていて、海辺のような感じがして美味しかった。
        カメルーンはアフリカの西、大西洋に面しているらしい。同僚と雑談して、帰宅。
        シャワーを浴び、ビールを開けて、アマトリチャーナを作った。キレがあって美味しい。ブルーチーズを時たまつまみながら食べる。
