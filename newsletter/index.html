<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="format-detection" content="telephone=no, email=no">
        <meta charset="UTF-8" />
        <title>Newsletter - Keita Kasai</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../CSS/style.css">
    </head>
    <body>
        <main>
            <div class="newsletter">
                <p>Subscribe to receive newsletter.</p>
                <form
                    action="https://buttondown.com/api/emails/embed-subscribe/keita"
                    method="post"
                    class="embeddable-buttondown-form"
                >
                    <input type="email" name="email" id="bd-email" placeholder="your email" required />
                    <input type="submit" value="Subscribe" />
                </form>
            </div>
        </main>
    </body>
</html>
