<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Photos - duck and dust</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            body {
                margin: 0;
                padding: 2em;
                background: #fff;
            }
            h1 {
                text-align: right;
                margin-bottom: 1.5em;
            }
            .gallery {
                column-count: 4;
                column-gap: 12px;
            }
            .gallery img {
                width: 100%;
                display: block;
                margin-bottom: 12px;
                break-inside: avoid;
                cursor: pointer;
                transition: opacity 0.2s ease;
            }
            .gallery img:hover {
                opacity: 0.85;
            }

            /* ブラウザ幅に応じて列数を変える */
            @media (max-width: 1100px) {
                .gallery { column-count: 3; }
            }
            @media (max-width: 700px) {
                .gallery { column-count: 2; }
            }
            @media (max-width: 420px) {
                .gallery { column-count: 1; }
            }

            /* クリックで拡大表示するライトボックス */
            .lightbox {
                display: none;
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.9);
                justify-content: center;
                align-items: center;
                z-index: 999;
                cursor: zoom-out;
            }
            .lightbox.active {
                display: flex;
            }
            .lightbox img {
                max-width: 90%;
                max-height: 90%;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Photos</h1>
            <div class="gallery">
                <img src="images/IMG_7463.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7464.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7484.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7490.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7492.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7504.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7511.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7556.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7552 2.JPG" onclick="openLightbox(this)">
                <img src="images/IMG_7510.JPG" onclick="openLightbox(this)">
            </div>

            <div class="lightbox" id="lightbox" onclick="closeLightbox()">
                <img id="lightbox-img" src="">
            </div>
        </main>

        <script>
            function openLightbox(el) {
                document.getElementById('lightbox-img').src = el.src;
                document.getElementById('lightbox').classList.add('active');
            }
            function closeLightbox() {
                document.getElementById('lightbox').classList.remove('active');
            }
        </script>
    </body>
</html>
