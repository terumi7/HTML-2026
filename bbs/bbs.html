<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>掲示板 — Keita Kasai</title>

  <style>
    body {
        margin: 28px;
        background: white;
        color: black;
        font-size: 16px;
    }

    main {
        width: 520px;
        max-width: 100%;
        margin-left: auto;
    }

    h1 {
        margin: 0 0 12px 0;
        font-size: 36px;
        font-weight: normal;
        text-align: right;
    }

    .intro {
        text-align: right;
        font-size: 14px;
        margin-bottom: 28px;
    }

    .top-line {
        border: 0;
        border-top: 2px solid black;
        margin: 0 0 30px 0;
    }

    .post {
        padding-bottom: 28px;
        margin-bottom: 28px;
        border-bottom: 1px dotted black;
    }

    .post:last-child {
        border-bottom: none;
    }

    .post-number {
        font-size: 14px;
        margin-bottom: 12px;
    }

    .post-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
    }

    .post-name {
        font-size: 17px;
    }

    .post-date {
        font-size: 14px;
    }

    .post-message {
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 17px;
        padding-left: 5px;
    }

    .bottom-line {
        border: 0;
        border-top: 2px solid black;
        margin: 10px 0 35px 0;
    }

    .write-title {
        text-align: right;
        font-size: 22px;
        margin-bottom: 30px;
    }

    form {
        width: 100%;
    }

    .field {
        margin-bottom: 24px;
    }

    label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
        font-size: 14px;
    }

    input,
    textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 6px;

        font-size: 16px;

        color: black;
        background: white;

        border: 1px solid black;
        border-radius: 0;
        outline: none;
    }

    textarea {
        height: 120px;
        resize: vertical;
    }

    .submit-area {
        text-align: right;
        margin-top: 5px;
    }

    button {
        font-size: 16px;
        padding: 4px 14px;

        color: black;
        background: white;

        border: 1px solid black;
        border-radius: 0;

        cursor: pointer;
    }

    #status {
        margin-top: 12px;
        text-align: right;
        font-size: 14px;
    }

    .footer {
        margin-top: 70px;
        padding-bottom: 30px;
        text-align: right;
        font-size: 14px;
    }

    .footer a {
        color: black;
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        body {
            margin: 20px;
        }

        main {
            width: 100%;
        }

        h1 {
            font-size: 36px;
        }
    }
</style>
</head>


<body>

<main>


  <h1>掲示板</h1>

  <hr class="top-line">


  <div id="posts">
    loading...
  </div>


  <hr class="bottom-line">


  <div class="write-title">
    Post
  </div>


  <form id="form">


    <div class="field">

      <label for="name">
        <span>name</span>
        <span>required</span>
      </label>

      <input
        id="name"
        type="text"
        maxlength="40"
        required
      >

    </div>


    <div class="field">

      <label for="message">
        <span>message</span>
        <span>required</span>
      </label>

      <textarea
        id="message"
        maxlength="1000"
        required
      ></textarea>

    </div>


    <div class="submit-area">

      <button type="submit">
        post
      </button>

    </div>


    <div id="status"></div>


  </form>


  <div class="footer">

    <a href="../index.html">home</a>
    &nbsp;/&nbsp;
    <a href="../photos/index.html">photos</a>
    &nbsp;/&nbsp;
    <a href="../blog/index.html">blog</a>

  </div>


</main>


<script>

const SUPABASE_URL =
  "https://kfxyrujmhaygjzptknsm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ";


async function loadPosts() {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/posts?select=*&order=created_at.asc`,
    {
      method: "GET",

      headers: {
        "apikey": SUPABASE_PUBLISHABLE_KEY
      }
    }
  );


  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(errorText);
  }


  const posts =
    await response.json();


  const container =
    document.getElementById("posts");


  if (posts.length === 0) {

    container.textContent =
      "no posts yet.";

    return;
  }


  container.innerHTML =
    posts.map((post, index) => {

      const date =
        new Date(post.created_at);


      const dateString =
        date.getFullYear() +
        "." +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "." +
        String(
          date.getDate()
        ).padStart(2, "0");


      const timeString =
        String(
          date.getHours()
        ).padStart(2, "0") +
        ":" +
        String(
          date.getMinutes()
        ).padStart(2, "0");


      const number =
        String(index + 1).padStart(3, "0");


      return `

        <div class="post">

          <div class="post-number">
            ${number}.
          </div>


          <div class="post-header">

            <div class="post-name">
              ${escapeHTML(post.name)}
            </div>

            <div class="post-date">
              ${dateString} ${timeString}
            </div>

          </div>


          <div class="post-message">
            ${escapeHTML(post.message)}
          </div>

        </div>

      `;

    }).join("");
}



document
  .getElementById("form")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const message =
        document
          .getElementById("message")
          .value
          .trim();


      const status =
        document.getElementById("status");


      if (!name || !message) {
        return;
      }


      status.textContent =
        "posting...";


      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/posts`,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=minimal"
              },

              body: JSON.stringify({
                name: name,
                message: message
              })
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            "POST ERROR:",
            response.status,
            errorText
          );

          throw new Error(errorText);
        }


        document
          .getElementById("form")
          .reset();


        status.textContent =
          "";


        await loadPosts();

      }


      catch (error) {

        console.error(
          "POST ERROR:",
          error
        );


        status.textContent =
          "could not post.";

      }

    }
  );



function escapeHTML(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text;


  return div.innerHTML;
}



loadPosts()
  .catch(error => {

    console.error(
      "GET ERROR:",
      error
    );


    document
      .getElementById("posts")
      .textContent =
        "could not load posts.";

  });

</script>


</body>
</html>
