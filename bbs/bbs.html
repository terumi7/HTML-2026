<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BBS — Keita Kasai</title>

  <style>
    body {
      margin: 28px;
      background: white;
      color: black;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
    }

    main {
      width: 700px;
      max-width: 100%;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;
      margin: 0 0 60px 0;
    }

    .post {
      margin-bottom: 40px;
    }

    .post-header {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .post-message {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    hr {
      border: 0;
      border-top: 1px solid black;
      margin: 40px 0;
    }

    form {
      margin-top: 50px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input,
    textarea {
      display: block;
      width: 400px;
      max-width: 100%;
      box-sizing: border-box;

      font-family: "Times New Roman", Times, serif;
      font-size: 16px;

      padding: 4px;
      margin-bottom: 18px;

      border: 1px solid #888;
      background: white;
    }

    textarea {
      height: 100px;
    }

    button {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;

      padding: 2px 8px;

      background: white;
      border: 1px solid #888;

      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>


<body>

<main>

  <h1>BBS</h1>


  <div id="posts">
    loading...
  </div>


  <hr>


  <form id="form">

    <label for="name">name</label>

    <input
      id="name"
      type="text"
      maxlength="40"
      required
    >


    <label for="message">message</label>

    <textarea
      id="message"
      maxlength="1000"
      required
    ></textarea>


    <button type="submit">post</button>

    <div id="status"></div>

  </form>

</main>


<script>

const SUPABASE_URL =
  "https://kfxyrujmhaygjzptknsm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ";


async function loadPosts() {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/posts?select=*&order=created_at.asc`,
    {
      method: "GET",

      headers: {
        "apikey": SUPABASE_PUBLISHABLE_KEY
      }
    }
  );


  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(errorText);
  }


  const posts =
    await response.json();


  const container =
    document.getElementById("posts");


  if (posts.length === 0) {

    container.textContent =
      "no posts yet.";

    return;
  }


  container.innerHTML =
    posts.map(post => {

      const date =
        new Date(post.created_at);


      const dateString =
        date.getFullYear() +
        "." +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "." +
        String(
          date.getDate()
        ).padStart(2, "0");


      return `
        <div class="post">

          <div class="post-header">
            ${escapeHTML(post.name)}
            &nbsp;
            ${dateString}
          </div>

          <div class="post-message">
            ${escapeHTML(post.message)}
          </div>

        </div>
      `;

    }).join("");
}



document
  .getElementById("form")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const message =
        document
          .getElementById("message")
          .value
          .trim();


      const status =
        document.getElementById("status");


      if (!name || !message) {
        return;
      }


      status.textContent =
        "posting...";


      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/posts`,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=minimal"
              },

              body: JSON.stringify({
                name: name,
                message: message
              })
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            "POST ERROR:",
            response.status,
            errorText
          );

          throw new Error(errorText);
        }


        document
          .getElementById("form")
          .reset();


        status.textContent = "";


        await loadPosts();

      }


      catch (error) {

        console.error(
          "POST ERROR:",
          error
        );


        status.textContent =
          "could not post.";
      }

    }
  );



function escapeHTML(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text;


  return div.innerHTML;
}



loadPosts()
  .catch(error => {

    console.error(
      "GET ERROR:",
      error
    );


    document
      .getElementById("posts")
      .textContent =
        "could not load posts.";

  });

</script>

</body>
</html>
