<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>bbs - Keita Kasai</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            text-align: right;
        }

        a {
            color: black;
        }

        main {
            width: 700px;
            max-width: 100%;
            margin-left: auto;
        }

        .post {
            margin-bottom: 40px;
        }

        .post-header {
            margin-bottom: 10px;
        }

        .post-message {
            white-space: pre-wrap;
        }

        hr {
            border: 0;
            border-top: 1px solid black;
            margin: 30px 0;
        }

        form {
            margin-top: 50px;
        }

        label {
            display: block;
        }

        input,
textarea {
    font: inherit;
    width: 400px;
    max-width: 100%;
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid black;
    border-radius: 0;
    padding: 0.4em;
    background: white;
}

input:focus,
textarea:focus {
    outline: none;
    border: 1px solid black;
}

        textarea {
            height: 100px;
        }

        button {
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: 1px solid black;
    color: black;
    padding: 0.3em 1em;
    cursor: pointer;
}

button:hover {
    background: black;
    color: white;
}
    </style>
</head>

<body>

<main>

    <section>

        <h1>BBS</h1>

        <div id="posts">
            loading...
        </div>

    </section>


    <hr>


    <section>

        <h2>Post</h2>

        <form id="form">

            <p>
                <label for="name">name</label>
                <input
                    id="name"
                    type="text"
                    maxlength="40"
                    required
                >
            </p>

            <p>
                <label for="message">message</label>
                <textarea
                    id="message"
                    maxlength="1000"
                    required
                ></textarea>
            </p>

            <p>
                <button type="submit">post</button>
            </p>

            <div id="status"></div>

        </form>

    </section>


    <p>
        <a href="../index.html">back to home</a>
    </p>

</main>


<script>

const SUPABASE_URL =
    "https://kfxyrujmhaygjzptknsm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ";


async function loadPosts() {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/posts?select=*&order=created_at.asc`,
        {
            method: "GET",

            headers: {
                "apikey": SUPABASE_PUBLISHABLE_KEY
            }
        }
    );


    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(errorText);
    }


    const posts =
        await response.json();


    const container =
        document.getElementById("posts");


    if (posts.length === 0) {

        container.textContent =
            "no posts yet.";

        return;
    }


    container.innerHTML =
        posts.map((post, index) => {

            const date =
                new Date(post.created_at);


            const dateString =
                date.getFullYear() +
                "." +
                String(
                    date.getMonth() + 1
                ).padStart(2, "0") +
                "." +
                String(
                    date.getDate()
                ).padStart(2, "0");


            const timeString =
                String(
                    date.getHours()
                ).padStart(2, "0") +
                ":" +
                String(
                    date.getMinutes()
                ).padStart(2, "0");


            return `
                <div class="post">

                    <div class="post-header">
                        ${String(index + 1).padStart(3, "0")}.
                        ${escapeHTML(post.name)}
                        -
                        ${dateString}
                        ${timeString}
                    </div>

                    <div class="post-message">
                        ${escapeHTML(post.message)}
                    </div>

                </div>
            `;

        }).join("");
}



document
    .getElementById("form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const message =
                document
                    .getElementById("message")
                    .value
                    .trim();


            const status =
                document.getElementById("status");


            if (!name || !message) {
                return;
            }


            status.textContent =
                "posting...";


            try {

                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/posts`,
                        {
                            method: "POST",

                            headers: {
                                "apikey":
                                    SUPABASE_PUBLISHABLE_KEY,

                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=minimal"
                            },

                            body: JSON.stringify({
                                name: name,
                                message: message
                            })
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "POST ERROR:",
                        response.status,
                        errorText
                    );

                    throw new Error(errorText);
                }


                document
                    .getElementById("form")
                    .reset();


                status.textContent =
                    "";


                await loadPosts();

            }


            catch (error) {

                console.error(
                    "POST ERROR:",
                    error
                );


                status.textContent =
                    "could not post.";

            }

        }
    );



function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;
}



loadPosts()
    .catch(error => {

        console.error(
            "GET ERROR:",
            error
        );


        document
            .getElementById("posts")
            .textContent =
                "could not load posts.";

    });

</script>

</body>
</html>
