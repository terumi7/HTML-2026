<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BBS — Keita Kasai</title>

  <style>
    body {
      margin: 40px;
      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1.6;
      color: #111;
      background: #fff;
    }

    main {
      max-width: 700px;
    }

    a {
      color: inherit;
      text-decoration: underline;
    }

    h1 {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 60px;
    }

    .post {
      margin-bottom: 45px;
    }

    .name {
      margin-bottom: 2px;
    }

    .date {
      font-size: 14px;
      margin-bottom: 12px;
    }

    .message {
      white-space: pre-wrap;
    }

    form {
      margin-top: 80px;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      border: none;
      border-bottom: 1px solid #111;
      padding: 8px 0;
      margin-bottom: 25px;
      outline: none;
      background: transparent;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      font: inherit;
      background: none;
      border: none;
      padding: 0;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>

<body>

<main>

  <h1>BBS</h1>

  <div id="posts"></div>

  <form id="form">

    <input
      id="name"
      type="text"
      placeholder="name"
      maxlength="40"
      required
    >

    <textarea
      id="message"
      placeholder="message"
      maxlength="1000"
      required
    ></textarea>

    <button type="submit">post</button>

  </form>

</main>

<script>
  const SUPABASE_URL = "https://kfxyrujmhaygjzptknsm.supabase.co/rest/v1/";
  const SUPABASE_ANON_KEY = "sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ";

  async function loadPosts() {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/posts?select=*&order=created_at.asc`,
      {
        headers: {
          apikey: sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ,
          Authorization: `Bearer ${sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ}`
        }
      }
    );

    const posts = await response.json();

    const container = document.getElementById("posts");

    container.innerHTML = posts.map(post => {

      const date = new Date(post.created_at);

      return `
        <div class="post">
          <div class="name">${escapeHTML(post.name)}</div>
          <div class="date">${date.toLocaleDateString()}</div>
          <div class="message">${escapeHTML(post.message)}</div>
        </div>
      `;

    }).join("");
  }


  document
    .getElementById("form")
    .addEventListener("submit", async (event) => {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const message =
        document.getElementById("message").value.trim();

      if (!name || !message) return;

      await fetch(
        `${SUPABASE_URL}/rest/v1/posts`,
        {
          method: "POST",

          headers: {
            apikey: sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ,
            Authorization: `Bearer ${sb_publishable_JaFVAjTvi4r0hIFNRvZWYA_c5xz7lXQ}`,
            "Content-Type": "application/json",
            Prefer: "return=minimal"
          },

          body: JSON.stringify({
            name: name,
            message: message
          })
        }
      );

      document.getElementById("form").reset();

      loadPosts();
    });


  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  loadPosts();
</script>

</body>
</html>
